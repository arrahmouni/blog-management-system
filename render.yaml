# Updated render.yaml
services:
  - type: web
    name: laravel-app
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    startCommand: >
      bash -c "
        php artisan migrate --force;
        php artisan serve --host=0.0.0.0 --port=8080
      "
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: your-mysql-host.render.com
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: your_database_name
      - key: DB_USERNAME
        value: your_username
      - key: DB_PASSWORD
        value: your_password
